name: LCGRemote
options:
  bundleIdPrefix: com.liftcontrolgate
  deploymentTarget:
    iOS: "16.0"
    watchOS: "9.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
settings:
  SWIFT_VERSION: "5.9"
targets:
  LCGRemote:
    type: application
    platform: iOS
    sources:
      - path: LCGRemote
        excludes:
          - "**/.gitkeep"
    settings:
      base:
        INFOPLIST_GENERATION: true
        PRODUCT_BUNDLE_IDENTIFIER: com.liftcontrolgate.lcgremote
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "LCG Remote needs Bluetooth to communicate with your lift controller."
    entitlements:
      path: LCGRemote/LCGRemote.entitlements
      properties:
        com.apple.developer.bluetooth.central: true
    dependencies:
      - framework: CoreBluetooth.framework
        embed: false
      - framework: WatchConnectivity.framework
        embed: false
      - sdk: SwiftData.framework
        embed: false

  LCGRemoteWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
        excludes:
          - "**/.gitkeep"
    settings:
      base:
        INFOPLIST_GENERATION: true
        PRODUCT_BUNDLE_IDENTIFIER: com.liftcontrolgate.lcgremote.watchkitapp
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: "YES"
        WATCHOS_DEPLOYMENT_TARGET: "9.0"
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: "watchsimulator watchos"
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.liftcontrolgate.lcgremote
    dependencies:
      - sdk: WatchConnectivity.framework
        embed: false

  LCGRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LCGRemoteTests
    dependencies:
      - target: LCGRemote
    settings:
      base:
        INFOPLIST_GENERATION: true
        GENERATE_INFOPLIST_FILE: "YES"
